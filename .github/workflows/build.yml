name: Build Mod JAR

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.3'

      - name: Build with Gradle
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: realistic-trees-mod
          path: build/libs/realistic-trees-1.0.0.jar
